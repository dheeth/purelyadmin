name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing! A persistent keystore is required so that updates have matching signatures."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pureadmin-release.jks
          cat << EOF > keystore.properties
          storeFile=pureadmin-release.jks
          storePassword=${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}
          keyAlias=pureadmin
          keyPassword=${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}
          EOF

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.0"
          fi
          cp app/build/outputs/apk/release/app-release.apk "artifacts/pureadmin-${VERSION_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/pureadmin-${VERSION_TAG}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: PureAdmin ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
