name: Release & F-Droid Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing! A persistent keystore is required so that updates have matching signatures."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pureadmin-release.jks
          cat << EOF > keystore.properties
          storeFile=pureadmin-release.jks
          storePassword=${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}
          keyAlias=pureadmin
          keyPassword=${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}
          EOF

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare Release Artifacts
        id: version
        run: |
          mkdir -p artifacts
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="v1.0.0"
          fi
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/release/app-release.apk "artifacts/pureadmin-${VERSION_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/pureadmin-${VERSION_TAG}.aab"

      - name: Upload APK for F-Droid Job
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/*.apk
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: PureAdmin ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab

  deploy-fdroid:
    name: Build & Deploy F-Droid Repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Tools & fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx apksigner
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Find latest Android build-tools on runner
          LATEST_BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_BT" ]; then
            echo "$LATEST_BT" >> $GITHUB_PATH
          fi
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}"
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          keytool -importkeystore \
            -srckeystore keystore.jks -srcstoretype JKS -srcstorepass "$PASS" \
            -destkeystore keystore.p12 -deststoretype PKCS12 -deststorepass "$PASS" \
            -srcalias pureadmin -destalias pureadmin -noprompt

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: download/

      - name: Prepare F-Droid Repo Structure
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        run: |
          mkdir -p fdroid_build/repo fdroid_build/metadata public/fdroid
          
          # Copy APK to fdroid repo
          cp download/*.apk fdroid_build/repo/
          
          # Copy icons
          mkdir -p fdroid_build/repo/icons public/fdroid/repo/icons
          cp fastlane/metadata/android/en-US/images/icon.png fdroid_build/repo/icons/icon.png
          cp fastlane/metadata/android/en-US/images/icon.png public/fdroid/repo/icons/icon.png
          cp fastlane/metadata/android/en-US/images/icon.png fdroid_build/repo/icon.png
          
          # Copy metadata
          cp fdroid/com.purelymail.admin.yml fdroid_build/metadata/com.purelymail.admin.yml
          
          # Move keystore to build directory
          mv keystore.p12 fdroid_build/keystore.p12
          
          PASS="${KEYSTORE_PASSWORD:-PureAdmin2026SecureKey}"
          cat << EOF > fdroid_build/config.yml
          repo_url: "https://dheeth.github.io/purelyadmin/fdroid/repo"
          repo_name: "PureAdmin"
          repo_icon: "icon.png"
          repo_description: "Official F-Droid repository for PureAdmin — lightweight, privacy-focused native Purelymail client."
          archive_older: 0
          keystore: "keystore.p12"
          keystorepass: "$PASS"
          keypass: "$PASS"
          repo_keyalias: "pureadmin"
          EOF

      - name: Compile and Sign F-Droid Index
        run: |
          cd fdroid_build
          fdroid update --create-metadata --verbose

      - name: Assemble Public Pages Content
        env:
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        run: |
          # Copy the compiled fdroid repo into public
          cp -r fdroid_build/repo public/fdroid/
          
          # Generate modern landing page
          python3 scripts/generate-fdroid-page.py public/index.html "${VERSION_TAG:-v1.0.0}"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
